# Local guard that runs the same checks as CI. One-time setup per clone:  pipx install pre-commit && pre-commit install
# - every commit: gitleaks scans the staged changes, private-key / large-file checks, prettier and eslint
# - every push:   gitleaks scans the commits being pushed, tsc typecheck
# Format and lint use the same tools and pinned versions as the shared CI workflow (platform-demo-workflows), so a clean
# local run means the `Lint & Format` job passes. This is a fast local guard (git push --no-verify skips it); the CI jobs,
# GitHub push protection and the CI secret scan are the enforcing layers.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: detect-private-key
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  - repo: local
    hooks:
      # Need `npm ci` once (the tools come from node_modules, the versions from package-lock.json); the same npm scripts as CI.
      - id: prettier-check
        name: prettier (npm run format:check, as CI)
        language: system
        entry: npm run format:check
        types: [ts]
        pass_filenames: false
        stages: [pre-commit]
      - id: eslint
        name: eslint (npm run lint, as CI)
        language: system
        entry: npm run lint
        types: [ts]
        pass_filenames: false
        stages: [pre-commit]
      - id: typecheck
        name: tsc (npm run typecheck, as CI)
        language: system
        entry: npm run typecheck
        types: [ts]
        pass_filenames: false
        stages: [pre-push]
      - id: gitleaks-push
        name: gitleaks (commits being pushed)
        language: golang
        additional_dependencies: [github.com/zricethezav/gitleaks/v8@v8.30.1]
        # pre-commit exports the pushed range; without it (e.g. a brand-new branch) the whole history is scanned
        entry: bash -c 'range=""; if [ -n "${PRE_COMMIT_FROM_REF:-}" ] && [ -n "${PRE_COMMIT_TO_REF:-}" ]; then range="${PRE_COMMIT_FROM_REF}..${PRE_COMMIT_TO_REF}"; fi; gitleaks git --redact --verbose ${range:+--log-opts="$range"}' --
        pass_filenames: false
        always_run: true
        stages: [pre-push]
